  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ht:700;color:#7C7365\">or<\u002Fspan>\n          <label style=\"flex:1;border:1px solid rgba(210,190,160,.55);border-radius:12px;padding:9px 10px;font-size:12px;font-weight:700;color:#675E52;text-align:center;cursor:pointer;background:rgba(255,255,255,.6)\">\n            📷 Upload image\n            <input type=\"file\" accept=\"image/*\" onchange=\"{{ onCFile }}\" style=\"display:none\">\n          <\u002Flabel>\n        <\u002Fdiv>\n        <sc-if value=\"{{ cImg }}\" hint-placeholder-val=\"{{ false }}\">\n          <button onclick=\"{{ onClearImg }}\" style=\"border:none;cursor:pointer;align-self:flex-start;font-size:11px;font-weight:700;color:#C05138;background:#FBE3DC;border-radius:999px;padding:4px 10px\">✕ Remove image<\u002Fbutton>\n        <\u002Fsc-if>\n        <div style=\"display:flex;gap:8px\">\n          <input value=\"{{ cName }}\" onchange=\"{{ onCName }}\" onkeydown=\"{{ onCNameKey }}\" placeholder=\"Sticker name (e.g. Matcha latte)\" maxlength=\"40\" style=\"flex:1;min-width:0;border:1px solid rgba(210,190,160,.55);border-radius:12px;padding:9px 11px;font-size:13.5px;font-weight:600;color:#413C36;outline:none;background:rgba(255,255,255,.6)\">\n          <button onclick=\"{{ onGenerate }}\" disabled=\"{{ genDisabled }}\" title=\"Let AI pick the emoji &amp; category from the name\" style=\"border:none;cursor:pointer;flex:none;padding:9px 13px;border-radius:12px;background:{{ genBg }};color:#FFFFFF;font-weight:700;font-size:12.5px\">{{ genLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ genError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:11.5px;font-weight:700;color:#C05138\">{{ genError }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:flex;gap:5px;flex-wrap:wrap\">\n          <sc-for list=\"{{ creatorCats }}\" as=\"cat\" hint-placeholder-count=\"5\">\n            <button onclick=\"{{ cat.onClick }}\" style=\"border:none;cursor:pointer;border-radius:999px;padding:6px 10px;font-family:Caveat,cursive;font-size:15.5px;font-weight:600;background:{{ cat.bg }};color:{{ cat.color }}\">{{ cat.emoji }} {{ cat.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:8px\">\n          <sc-if value=\"{{ creatorEditId }}\" hint-placeholder-val=\"{{ false }}\">\n            <button onclick=\"{{ onDeleteCustom }}\" style=\"border:none;cursor:pointer;padding:10px 14px;border-radius:999px;background:#FBE3DC;color:#C05138;font-weight:700;font-size:13px\">{{ creatorDeleteLabel }}<\u002Fbutton>\n          <\u002Fsc-if>\n          <button onclick=\"{{ closeCreator }}\" style=\"border:1px solid rgba(210,190,160,.55);cursor:pointer;flex:1;padding:9px;border-radius:999px;background:#FFFFFF;color:#675E52;font-weight:700;font-size:13px\">Cancel<\u002Fbutton>\n          <button onclick=\"{{ onSaveCreator }}\" style=\"border:none;cursor:pointer;flex:1;padding:10px;border-radius:999px;background:{{ accent }};color:#FFFFFF;font-weight:700;font-size:13px\">{{ creatorSaveLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ exportOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div onclick=\"{{ closeExport }}\" style=\"position:fixed;inset:0;background:rgba(74,64,56,.38);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px\">\n      <div onclick=\"{{ eatClick }}\" data-screen-label=\"Export CSV\" style=\"background:rgba(252,250,246,.9);backdrop-filter:blur(24px) saturate(1.4);border:1px solid rgba(255,255,255,.9);border-radius:24px;padding:20px;width:340px;max-width:100%;animation:sll-fade .2s ease;display:flex;flex-direction:column;gap:13px\">\n        <div style=\"font-family:'Baloo 2',Quicksand,sans-serif;font-size:19px;font-weight:700\">Export CSV<\u002Fdiv>\n        <div style=\"display:flex;gap:6px\">\n          <button onclick=\"{{ onExAll }}\" style=\"border:none;cursor:pointer;flex:1;padding:9px;border-radius:999px;font-weight:700;font-size:12.5px;background:{{ exAllBg }};color:{{ exAllColor }}\">All data<\u002Fbutton>\n          <button onclick=\"{{ onExRange }}\" style=\"border:none;cursor:pointer;flex:1;padding:9px;border-radius:999px;font-weight:700;font-size:12.5px;background:{{ exRangeBg }};color:{{ exRangeColor }}\">Date range<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ exIsRange }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;gap:8px;align-items:center\">\n            <input type=\"date\" value=\"{{ exFrom }}\" onchange=\"{{ onExFrom }}\" style=\"flex:1;min-width:0;border:1px solid rgba(210,190,160,.55);border-radius:12px;padding:7px 8px;font-size:12.5px;font-weight:600;color:#413C36;outline:none;background:rgba(255,255,255,.6)\">\n            <span style=\"font-size:12px;font-weight:700;color:#7C7365\">→<\u002Fspan>\n            <input type=\"date\" value=\"{{ exTo }}\" onchange=\"{{ onExTo }}\" style=\"flex:1;min-width:0;border:1px solid rgba(210,190,160,.55);border-radius:12px;padding:7px 8px;font-size:12.5px;font-weight:600;color:#413C36;outline:none;background:rgba(255,255,255,.6)\">\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"font-size:12px;font-weight:700;color:#7C7365\">{{ exportCountLabel }}<\u002Fdiv>\n        <sc-if value=\"{{ exCsv }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:7px\">\n            <div style=\"font-size:11.5px;font-weight:700;color:#675E52\">{{ exDownloadNote }}<\u002Fdiv>\n            <textarea readonly=\"\" value=\"{{ exCsv }}\" style=\"width:100%;box-sizing:border-box;height:110px;border:1px solid rgba(210,190,160,.55);border-radius:12px;padding:8px 10px;font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:#413C36;background:rgba(255,255,255,.6);resize:vertical\"><\u002Ftextarea>\n            <button onclick=\"{{ onCopyCsv }}\" style=\"border:none;cursor:pointer;align-self:flex-start;padding:8px 14px;border-radius:999px;background:rgba(158,110,68,.14);color:#7E5432;font-weight:700;font-size:12px\">{{ exCopyLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"border-top:1px solid rgba(210,190,160,.45);padding-top:11px;display:flex;flex-direction:column;gap:8px\">\n          <div style=\"font-size:12px;font-weight:700;color:#675E52\">Backup &amp; restore — all data as one file<\u002Fdiv>\n          <div style=\"display:flex;gap:8px\">\n            <button onclick=\"{{ onBackup }}\" style=\"border:none;cursor:pointer;flex:1;padding:9px;border-radius:999px;background:rgba(158,110,68,.14);color:#7E5432;font-weight:700;font-size:12px\">⤓ Backup (.json)<\u002Fbutton>\n            <label style=\"flex:1;border:1px solid rgba(210,190,160,.55);cursor:pointer;padding:8px;border-radius:999px;background:rgba(255,255,255,.65);color:#675E52;font-weight:700;font-size:12px;text-align:center\">⤒ Restore\n              <input type=\"file\" accept=\"application/json,.json\" onchange=\"{{ onRestoreFile }}\" style=\"display:none\">\n            <\u002Flabel>\n          <\u002Fdiv>\n          <sc-if value=\"{{ restoreMsg }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:11.5px;font-weight:700;color:#5F8F6E\">{{ restoreMsg }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <sc-if value=\"{{ showApiKeys }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"border-top:1px solid rgba(210,190,160,.45);padding-top:11px;display:flex;flex-direction:column;gap:7px\">\n            <div style=\"font-size:12px;font-weight:700;color:#675E52\">Online AI — free API keys<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:8px\">\n              <span style=\"font-size:11px;font-weight:700;color:#675E52;width:88px;flex:none\">emoji-api.com<\u002Fspan>\n              <input value=\"{{ emojiKey }}\" onchange=\"{{ onEmojiKey }}\" placeholder=\"optional — emoji.family used first, no key needed\" style=\"flex:1;min-width:0;border:1px solid rgba(210,190,160,.55);border-radius:10px;padding:7px 9px;font-size:11.5px;font-weight:600;color:#413C36;background:rgba(255,255,255,.6);outline:none\">\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:8px\">\n              <span style=\"font-size:11px;font-weight:700;color:#675E52;width:88px;flex:none\">calorieapi.com<\u002Fspan>\n              <input value=\"{{ calorieKey }}\" onchange=\"{{ onCalorieKey }}\" placeholder=\"API key (preferred for nutrition)\" style=\"flex:1;min-width:0;border:1px solid rgba(210,190,160,.55);border-radius:10px;padding:7px 9px;font-size:11.5px;font-weight:600;color:#413C36;background:rgba(255,255,255,.6);outline:none\">\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:8px\">\n              <span style=\"font-size:11px;font-weight:700;color:#675E52;width:88px;flex:none\">USDA FDC<\u002Fspan>\n              <input value=\"{{ usdaKey }}\" onchange=\"{{ onUsdaKey }}\" placeholder=\"DEMO_KEY (works out of the box)\" style=\"flex:1;min-width:0;border:1px solid rgba(210,190,160,.55);border-radius:10px;padding:7px 9px;font-size:11.5px;font-weight:600;color:#413C36;background:rgba(255,255,255,.6);outline:none\">\n            <\u002Fdiv>\n            <div style=\"font-size:10.5px;font-weight:600;color:#675E52;line-height:1.5\">Sticker generate uses emoji.family (no key) with emoji-api.com as fallback · nutrition uses calorieapi.com, falling back to USDA FoodData Central · daily poem from beanpoems.com (no key). Keys are stored only in this browser.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:flex;gap:8px\">\n          <button onclick=\"{{ closeExport }}\" style=\"border:1px solid rgba(210,190,160,.55);cursor:pointer;flex:1;padding:9px;border-radius:999px;background:#FFFFFF;color:#675E52;font-weight:700;font-size:13px\">Cancel<\u002Fbutton>\n          <button onclick=\"{{ onDoExport }}\" style=\"border:none;cursor:pointer;flex:1;padding:10px;border-radius:999px;background:{{ accent }};color:#FFFFFF;font-weight:700;font-size:13px\">⤓ Download<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;accent&quot;: { &quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#A9794F&quot;, &quot;options&quot;: [&quot;#A9794F&quot;, &quot;#4E7E77&quot;, &quot;#6F87A0&quot;, &quot;#E8836B&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Theme&quot; },\n  &quot;weekStart&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;Monday&quot;, &quot;options&quot;: [&quot;Sunday&quot;, &quot;Monday&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Calendar&quot; },\n  &quot;stickerSize&quot;: { &quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 17, &quot;min&quot;: 14, &quot;max&quot;: 28, &quot;step&quot;: 1, &quot;unit&quot;: &quot;px&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Calendar&quot; }\n}\">\nclass Component extends DCLogic {\n  state = {\n    view: 'month',\n    cursor: this.fmt(new Date()),\n    selectedDate: this.fmt(new Date()),\n    activeCat: 'food',\n    entries: [],\n    custom: [],\n    detailId: null,\n    creatorOpen: false, creatorEditId: null, cName: '', cEmoji: '', cImg: null, cCat: 'food',\n    genLoading: false, genError: '',\n    nutriLoading: false, nutriKey: '', nutriData: null, nutriError: '',\n    exportOpen: false, exMode: 'all', exFrom: '', exTo: '', exCsv: '', exDownloaded: false, exCopied: false,\n    hoverDate: null, justAdded: null,\n    isMobile: false,\n    overrides: {}, hiddenDefaults: [], dayNotes: {},\n    peekDate: null, muted: false, touchDrag: null, restoreMsg: '',\n    lastBackup: '', nudgeSnooze: '', firstUse: '',\n    avatar: null, cheer: ''\n  };\n\n  fmt(d) { const p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); }\n  parse(s) { const a = s.split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); }\n  accent() { return this.props.accent ?? '#A9794F'; }\n  mix(pct, base) { return 'color-mix(in oklab, ' + this.accent() + ' ' + pct + '%, ' + (base || 'white') + ')'; }\n  stickerSize() { return Number(this.props.stickerSize ?? 18); }\n\n  componentDidMount() {\n    try {\n      const raw = localStorage.getItem('sll-data-v1');\n      if (raw) { const d = JSON.parse(raw); this.setState({ entries: d.entries || [], custom: d.custom || [], overrides: d.overrides || {}, hiddenDefaults: d.hiddenDefaults || [], avatar: d.avatar || null, dayNotes: d.dayNotes || {} }); }\n    } catch (e) { }\n    try { this.setState({ muted: localStorage.getItem('sll-muted') === '1' }); } catch (e) { }\n    this._mq = window.matchMedia('(max-width: 760px)');\n    this._mqFn = () => this.setState({ isMobile: this._mq.matches });\n    this._mq.addEventListener('change', this._mqFn);\n    this._mqFn();\n    this.loadCheer();\n    try {\n      let firstUse = localStorage.getItem('sll-first-use');\n      if (!firstUse) { firstUse = this.fmt(new Date()); localStorage.setItem('sll-first-use', firstUse); }\n      this.setState({\n        firstUse,\n        lastBackup: localStorage.getItem('sll-last-backup') || '',\n        nudgeSnooze: localStorage.getItem('sll-nudge-snooze') || ''\n      });\n    } catch (e) { }\n  }\n  daysSince(ds) {\n    if (!ds) return 9999;\n    const ms = new Date() - this.parse(ds);\n    return Math.floor(ms / 86400000);\n  }\n\n  async loadCheer() {\n    const today = this.fmt(new Date());\n    try {\n      const c = JSON.parse(localStorage.getItem('sll-cheer') || 'null');\n      if (c && c.date === today && c.text) { this.setState({ cheer: c.text }); return; }\n    } catch (e) { }\n    if (!this.hasClaude()) {\n      const pool = [\n        'small steps, sticker by sticker \\u2600\\ufe0f', 'today deserves a good sticker', 'you showed up \\u2014 that counts \\u2b50',\n        'one little log, one good day', 'collect the tiny wins \\ud83c\\udf31', 'your week is looking sticker-worthy',\n        'a fresh page, all yours \\u270f\\ufe0f', 'log it, then go live it', 'little moments add up \\ud83e\\udde9',\n        'be kind to future-you \\u2014 log today', 'every day gets a sticker chance', 'nice to see you again \\ud83d\\udc4b',\n        'make it a three-sticker day \\ud83c\\udf89', 'the pile grows, so do you \\ud83c\\udf3f'\n      ];\n      const doy = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / 86400000);\n      this.setState({ cheer: pool[doy % pool.length] });\n      try {\n        const r = await fetch('https://www.beanpoems.com/api/random');\n        const p = await r.json();\n        const firstLine = (p.body || '').split('\\n')[0].trim();\n        const text = ((p.title ? p.title + ' \\u2014 ' : '') + firstLine).slice(0, 80);\n        if (text.trim()) {\n          this.setState({ cheer: text });\n          try { localStorage.setItem('sll-cheer', JSON.stringify({ date: today, text })); } catch (e) { }\n        }\n      } catch (e) { }\n      return;\n    }\n    try {\n      const raw = await window.claude.complete({\n        system: 'Write ONE short, cheerful, gender-neutral line or micro-poem (max 60 characters) to greet someone opening their daily life-log journal. Warm, playful, never cheesy-romantic. Plain text only, no quotes, at most one emoji.',\n        messages: [{ role: 'user', content: 'Today is ' + new Date().toDateString() + '. Write today\\'s line.' }]\n      });\n      const text = raw.trim().split('\\n')[0].slice(0, 70);\n      if (text) {\n        this.setState({ cheer: text });\n        try { localStorage.setItem('sll-cheer', JSON.stringify({ date: today, text })); } catch (e) { }\n      }\n    } catch (e) { }\n  }\n\n  onAvatarFile(e) {\n    const f = e.target.files && e.target.files[0];\n    e.target.value = '';\n    if (!f) return;\n    const r = new FileReader();\n    r.onload = () => {\n      const img = new Image();\n      img.onload = () => {\n        const S = 128, c = document.createElement('canvas');\n        c.width = S; c.height = S;\n        const ctx = c.getContext('2d');\n        const m = Math.min(img.width, img.height);\n        ctx.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, S, S);\n        this.setState({ avatar: c.toDataURL('image/jpeg', 0.85) }, () => this.persist());\n      };\n      img.src = r.result;\n    };\n    r.readAsDataURL(f);\n  }\n  componentWillUnmount() { if (this._mq) this._mq.removeEventListener('change', this._mqFn); }\n  persist() { try { localStorage.setItem('sll-data-v1', JSON.stringify({ entries: this.state.entries, custom: this.state.custom, overrides: this.state.overrides, hiddenDefaults: this.state.hiddenDefaults, avatar: this.state.avatar, dayNotes: this.state.dayNotes })); } catch (e) { } }\n\n  catDefs() {\n    return [\n      { id: 'food', label: 'Food', emoji: '🍙', color: '#A6761A', bg: '#FFE8C2' },\n      { id: 'drinks', label: 'Drinks', emoji: '🧋', color: '#2A7A99', bg: '#CFEAF5' },\n      { id: 'exercise', label: 'Exercise', emoji: '🏃', color: '#3E7F3A', bg: '#D6EFCB' },\n      { id: 'health', label: 'Health', emoji: '💊', color: '#B04A77', bg: '#FBD9E6' },\n      { id: 'other', label: 'Other', emoji: '⭐', color: '#6A5AAE', bg: '#E4DCF7' }\n    ];\n  }\n  defaults() {\n    return [\n      ['rice', 'Rice', '🍚', 'food'], ['curry', 'Curry', '🍛', 'food'], ['ramen', 'Ramen', '🍜', 'food'], ['sushi', 'Sushi', '🍣', 'food'], ['bread', 'Bread', '🍞', 'food'], ['salad', 'Salad', '🥗', 'food'], ['icecream', 'Ice cream', '🍦', 'food'], ['cake', 'Cake', '🍰', 'food'], ['snacks', 'Snacks', '🍿', 'food'],\n      ['water', 'Water', '💧', 'drinks'], ['milktea', 'Milk tea', '🧋', 'drinks'], ['coffee', 'Coffee', '☕', 'drinks'], ['juice', 'Juice', '🧃', 'drinks'], ['beer', 'Beer', '🍺', ' e) {\n        this.setState({ nutriLoading: false, nutriError: 'Could not reach the nutrition services — try again.' });\n      }\n      return;\n    }\n    const lines = items.map(e => {\n      const s = this.getSticker(e.stickerId);\n      return '- ' + s.name + ' x' + (e.qty || 1) + (e.note ? ' (' + e.note + ')' : '');\n    }).join('\\n');\n    try {\n      const raw = await window.claude.complete({\n        system: 'You estimate the total nutrition of a day of food and drinks logged as simple sticker names. Assume typical single servings unless quantity or note says otherwise. Reply with ONLY a JSON object, no markdown: {\"calories\":<int kcal>,\"protein_g\":<int>,\"carbs_g\":<int>,\"fat_g\":<int>,\"summary\":\"<one friendly sentence about the day, max 120 chars>\"}',\n        messages: [{ role: 'user', content: lines }]\n      });\n      const m = raw.match(/\\{[\\s\\S]*\\}/);\n      const j = JSON.parse(m ? m[0] : raw);\n      this.setState({ nutriLoading: false, nutriKey: sig, nutriData: j });\n    } catch (e) {\n      this.setState({ nutriLoading: false, nutriError: 'Could not estimate — try again.' });\n    }\n  }\n  openDay(ds) {\n    const lastCalView = this.state.view === 'day' ? (this.state.lastCalView || 'month') : this.state.view;\n    this.setState({ view: 'day', cursor: ds, selectedDate: ds, lastCalView }, () => this.calcNutrition(ds));\n  }\n\n  buildDayLanes() {\n    const list = this.entriesFor(this.state.cursor);\n    const lanes = [];\n    this.slotDefs().forEach(sl => {\n      const es = list.filter(e => e.slot === sl.id);\n      if (es.length) lanes.push({ label: sl.label, emoji: sl.emoji, entries: es.map(e => this.entryChip(e)) });\n    });\n    const slotIds = this.slotDefs().map(sl => sl.id);\n    const rest = list.filter(e => !e.slot || !slotIds.includes(e.slot));\n    if (rest.length) lanes.push({ label: 'All day', emoji: '📌', entries: rest.map(e => this.entryChip(e)) });\n    return lanes;\n  }\n\n  updDayNote(ds, text) {\n    const dayNotes = Object.assign({}, this.state.dayNotes);\n    if (text) dayNotes[ds] = text; else delete dayNotes[ds];\n    this.setState({ dayNotes }, () => this.persist());\n  }\n\n  buildPeek() {\n    const ds = this.state.peekDate;\n    if (!ds) return null;\n    const list = this.entriesFor(ds).map(e => this.entryChip(e));\n    return {\n      title: this.shortLabel(ds),\n      countLabel: list.length === 1 ? '1 sticker' : list.length + ' stickers',\n      empty: list.length === 0,\n      entries: list,\n      note: this.state.dayNotes[ds] || '',\n      onNote: (e) => this.updDayNote(ds, e.target.value),\n      onOpenDay: () => { this.setState({ peekDate: null }); this.openDay(ds); }\n    };\n  }\n\n  buildDetail() {\n    const e = this.state.entries.find(x => x.id === this.state.detailId);\n    if (!e) return null;\n    const st = this.getSticker(e.stickerId);\n    const hasSlot = st.cat === 'food' || st.cat === 'drinks';\n    return {\n      hasSlot,\n      slots: hasSlot ? this.slotDefs().map(sl => ({\n        label: sl.emoji + ' ' + sl.label,\n        bg: e.slot === sl.id ? this.accent() : 'rgba(255,255,255,.55)',\n        color: e.slot === sl.id ? '#FFFFFF' : '#7A6E56',\n        onClick: () => this.updEntry(e.id, { slot: sl.id })\n      })) : [],\n      name: st.name, emoji: st.emoji || '', img: st.img || '', noImg: !st.img && !!st.emoji, tag: !st.img && !st.emoji,\n      imgNode: this.imgEl(st.img, { width: 38, height: 38, borderRadius: 9, objectFit: 'cover' }),\n      bg: this.catBg(st.cat), catLabel: this.catLabel(st.cat),\n      dateLabel: this.shortLabel(e.date),\n      qty: e.qty || 1, note: e.note || '',\n      onMinus: () => { const q = (e.qty || 1); if (q <= 1) this.delEntry(e.id); else this.updEntry(e.id, { qty: q - 1 }); },\n      onPlus: () => this.updEntry(e.id, { qty: (e.qty || 1) + 1 }),\n      onNote: (ev) => this.updEntry(e.id, { note: ev.target.value }),\n      onDelete: () => this.delEntry(e.id)\n    };\n  }\n\n  renderVals() {\n    const s = thi
